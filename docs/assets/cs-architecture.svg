<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family='"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif'>
<title>DramaForge architecture and data boundary</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="1240" height="720" fill="#ffffff"/>
<text x="40" y="48" font-size="23" font-weight="700" fill="#111827" text-anchor="start">Thin server / thick client: where the data boundary sits</text>
<text x="40" y="76" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">The server holds AI keys and database metadata, zero media bytes; every asset and every render stays on the user's disk. One 1.8 GB machine runs the whole stack.</text>
<rect x="40" y="108" width="540" height="300" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
<text x="60" y="136" font-size="15" font-weight="700" fill="#166534" text-anchor="start">Client (Electron)</text>
<text x="60" y="156" font-size="11" font-weight="400" fill="#15803d" text-anchor="start">All the heavy lifting: decode, render, compose, shrink</text>
<rect x="60" y="174" width="500" height="46" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
<text x="74" y="194" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">ffmpeg</text>
<text x="74" y="210" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">cut, concat, audio tracks, cover remux</text>
<rect x="60" y="230" width="500" height="46" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
<text x="74" y="250" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">sharp</text>
<text x="74" y="266" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">image resize, format and size reduction</text>
<rect x="60" y="286" width="500" height="46" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
<text x="74" y="306" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Face grid</text>
<text x="74" y="322" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">OpenCV DNN + Haar, keeps refs from looking real</text>
<rect x="60" y="342" width="500" height="46" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
<text x="74" y="362" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Media library</text>
<text x="74" y="378" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">video / image / audio all on local disk</text>
<rect x="660" y="108" width="540" height="300" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="680" y="136" font-size="15" font-weight="700" fill="#1e40af" text-anchor="start">Cloud (Docker Compose)</text>
<text x="680" y="156" font-size="11" font-weight="400" fill="#1d4ed8" text-anchor="start">Orchestration and billing only, never media bytes</text>
<rect x="680" y="174" width="500" height="46" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
<text x="694" y="194" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">web</text>
<text x="694" y="210" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">Next.js 16 / React 19, pages and API routes</text>
<rect x="680" y="230" width="500" height="46" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
<text x="694" y="250" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">server</text>
<text x="694" y="266" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">domain business · gateway providers · task queues</text>
<rect x="680" y="286" width="500" height="46" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
<text x="694" y="306" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">ai-worker</text>
<text x="694" y="322" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">BullMQ consumers: text / image / video / voice</text>
<rect x="680" y="342" width="500" height="46" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
<text x="694" y="362" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">PostgreSQL · Redis · MinIO</text>
<text x="694" y="378" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">metadata, queues, form-style storage</text>
<line x1="580" y1="200" x2="660" y2="200" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="660" y1="230" x2="580" y2="230" stroke="#94a3b8" stroke-width="1.6"/>
<text x="620" y="190" font-size="9.5" font-weight="700" fill="#6b7280" text-anchor="middle">task dispatch</text>
<text x="620" y="250" font-size="9.5" font-weight="700" fill="#6b7280" text-anchor="middle">state back</text>
<rect x="578" y="300" width="84" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="620" y="330" font-size="20" font-weight="700" fill="#dc2626" text-anchor="middle">0</text>
<text x="620" y="352" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">media</text>
<text x="620" y="368" font-size="9.5" font-weight="400" fill="#6b7280" text-anchor="middle">bytes up</text>
<rect x="40" y="452" width="372" height="116" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="56" y="476" font-size="12" font-weight="700" fill="#111827" text-anchor="start">AI keys live server-side only</text>
<text x="56" y="500" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">A full grep on the client turns up zero keys.</text>
<text x="56" y="519" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">No local BYOK, so nothing can be</text>
<text x="56" y="538" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">generated offline — that is the design.</text>
<rect x="440" y="452" width="372" height="116" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="456" y="476" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Media stays on local disk</text>
<text x="456" y="500" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">The pipeline is aligned; per-shot image and</text>
<text x="456" y="519" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">video persistence is still migration debt,</text>
<text x="456" y="538" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">marked in code and hooked for new code.</text>
<rect x="840" y="452" width="372" height="116" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="856" y="476" font-size="12" font-weight="700" fill="#111827" text-anchor="start">Frontend mirrors the existing product</text>
<text x="856" y="500" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">One-to-one at the flow level, no invented</text>
<text x="856" y="519" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">interactions; visual alignment is held</text>
<text x="856" y="538" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="start">by discipline, not by hard blocks.</text>
<rect x="40" y="606" width="1160" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="60" y="632" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Gateway egress (8 adapters, one entry: callAI(model, payload, cred, ctx))</text>
<text x="60" y="656" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">ARK Seedance · OpenAI · Google Gemini · DeepSeek · Kimi · MiniMax · in-house ComfyUI</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family='"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif'>
<title>DramaForge 业务流程</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="1240" height="900" fill="#ffffff"/>
<text x="40" y="48" font-size="24" font-weight="700" fill="#111827" text-anchor="start">DramaForge 业务流程：从一段文本到可交付的短剧成片</text>
<text x="40" y="76" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">五阶段流水线。每阶段只做一件事，产出落到一张表，下一阶段从表里读——所以可以随时停、随时改、随时重跑。</text>
<rect x="33" y="108" width="214" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="140.0" y="138" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">1  输入</text>
<text x="140.0" y="160" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">导入剧本或参考视频</text>
<text x="140.0" y="174" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="middle">锁定画风与题材</text>
<line x1="250" y1="145.0" x2="269" y2="145.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="33" y="234" width="214" height="92" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="45" y="254" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="start">写入</text>
<text x="45" y="274" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">projects.novelText</text>
<text x="45" y="291" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">projects.artStyle</text>
<line x1="140.0" y1="186" x2="140.0" y2="230" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="273" y="108" width="214" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="380.0" y="138" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">2  编剧分析</text>
<text x="380.0" y="160" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">拆场景、提角色</text>
<text x="380.0" y="174" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="middle">输出分集结构</text>
<line x1="490" y1="145.0" x2="509" y2="145.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="273" y="234" width="214" height="92" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="285" y="254" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="start">写入</text>
<text x="285" y="274" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">episodes.scenes[]</text>
<text x="285" y="291" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">emotionArc · visualStyle</text>
<line x1="380.0" y1="186" x2="380.0" y2="230" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="513" y="108" width="214" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="620.0" y="138" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">3  资产设定</text>
<text x="620.0" y="160" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">角色 / 场景 / 道具定妆</text>
<text x="620.0" y="174" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="middle">一张参考图锁一个人</text>
<line x1="730" y1="145.0" x2="749" y2="145.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="513" y="234" width="214" height="92" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="525" y="254" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="start">写入</text>
<text x="525" y="274" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">assets(kind=CHARACTER</text>
<text x="525" y="291" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">PROP / LOCATION)</text>
<line x1="620.0" y1="186" x2="620.0" y2="230" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="753" y="108" width="214" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="860.0" y="138" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">4  分镜设计</text>
<text x="860.0" y="160" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">镜头时长、提示词、引用</text>
<text x="860.0" y="174" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="middle">镜头与镜头组规划</text>
<line x1="970" y1="145.0" x2="989" y2="145.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="753" y="234" width="214" height="92" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="765" y="254" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="start">写入</text>
<text x="765" y="274" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">shots(referencedAssets[]</text>
<text x="765" y="291" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">purposeTag · aspectRatio)</text>
<line x1="860.0" y1="186" x2="860.0" y2="230" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="993" y="108" width="214" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="1100.0" y="138" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">5  生产制作</text>
<text x="1100.0" y="160" font-size="11.5" font-weight="400" fill="#111827" text-anchor="middle">生成、选片、合成、导出</text>
<text x="1100.0" y="174" font-size="10.5" font-weight="400" fill="#6b7280" text-anchor="middle">本地渲染出成片</text>
<rect x="993" y="234" width="214" height="92" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="1005" y="254" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="start">写入</text>
<text x="1005" y="274" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">tasks → materials</text>
<text x="1005" y="291" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">render_jobs → 成片</text>
<line x1="1100.0" y1="186" x2="1100.0" y2="230" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="40" y="396" font-size="13" font-weight="700" fill="#111827" text-anchor="start">数据对象（PostgreSQL 元数据；媒体字节一个都不在服务器）</text>
<rect x="40" y="408" width="168" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="124.0" y="436" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">projects</text>
<line x1="211" y1="430" x2="230" y2="430" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="234" y="408" width="168" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="318.0" y="436" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">episodes</text>
<line x1="405" y1="430" x2="424" y2="430" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="428" y="408" width="168" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="512.0" y="436" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">assets</text>
<line x1="599" y1="430" x2="618" y2="430" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="622" y="408" width="168" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="706.0" y="436" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">shots</text>
<line x1="793" y1="430" x2="812" y2="430" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="816" y="408" width="168" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="900.0" y="436" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">materials</text>
<line x1="987" y1="430" x2="1006" y2="430" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="1010" y="408" width="168" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="1094.0" y="436" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">render_jobs</text>
<rect x="40" y="474" width="372" height="62" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="54" y="496" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">tasks + task_events</text>
<text x="54" y="518" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">异步任务与进度事件（四条队列）</text>
<rect x="440" y="474" width="372" height="62" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="454" y="496" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">billing_ledger</text>
<text x="454" y="518" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">计费流水：元 → 积分，加价 20%，最小 1 积分</text>
<rect x="840" y="474" width="372" height="62" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="854" y="496" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">api_configs</text>
<text x="854" y="518" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="start">平台 key 池，按模型分组轮转</text>
<text x="40" y="596" font-size="13" font-weight="700" fill="#111827" text-anchor="start">四条贯穿全流程的硬规则</text>
<rect x="40" y="610" width="568" height="92" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
<text x="56" y="636" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="start">一个镜头组引用的人物 ≤ 4</text>
<text x="56" y="658" font-size="11" font-weight="400" fill="#78350f" text-anchor="start">火山 Seedance 官方建议参考人物超过 4 个时保脸稳定性下降、易出双胞胎；</text>
<text x="56" y="676" font-size="11" font-weight="400" fill="#78350f" text-anchor="start">超出直接 400 拦下，不靠事后挑图。</text>
<rect x="636" y="610" width="568" height="92" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
<text x="652" y="636" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="start">敏感词在一处映射，三条链路同时生效</text>
<text x="652" y="658" font-size="11" font-weight="400" fill="#78350f" text-anchor="start">资产生图、场景站位图、视频生成共用一个 sanitize 函数；</text>
<text x="652" y="676" font-size="11" font-weight="400" fill="#78350f" text-anchor="start">视频链路改写后还有一次幂等兜底，防止禁词被写回来。</text>
<rect x="40" y="718" width="568" height="92" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
<text x="56" y="744" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="start">key 池 + 并发闸门，并发上限按用户可调</text>
<text x="56" y="766" font-size="11" font-weight="400" fill="#78350f" text-anchor="start">全局限流之外按用户放行；单 key 失败进冷却，请求换 key 继续，</text>
<text x="56" y="784" font-size="11" font-weight="400" fill="#78350f" text-anchor="start">队列里等待而不是打爆上游。</text>
<rect x="636" y="718" width="568" height="92" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
<text x="652" y="744" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="start">渲染任务靠租约 + 心跳，但心跳不能当存活证明</text>
<text x="652" y="766" font-size="11" font-weight="400" fill="#78350f" text-anchor="start">心跳每 30 秒续租，卡死的任务心跳照样新鲜——所以另加不看心跳的</text>
<text x="652" y="784" font-size="11" font-weight="400" fill="#78350f" text-anchor="start">claim 硬上限（默认 4 小时，长视频改写 12 小时）。</text>
<text x="40" y="866" font-size="10.5" font-weight="400" fill="#9ca3af" text-anchor="start">图由仓库代码与 migrations 派生，非界面截图。</text>
</svg>

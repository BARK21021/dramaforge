<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family='"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif'>
<title>DramaForge business flow</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker></defs>
<rect width="1240" height="900" fill="#ffffff"/>
<text x="40" y="48" font-size="23" font-weight="700" fill="#111827" text-anchor="start">DramaForge pipeline: from a block of text to a deliverable cut</text>
<text x="40" y="76" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">Five stages. Each stage does one thing and writes one table; the next stage reads from it — so you can stop, edit and re-run at any point.</text>
<rect x="35" y="108" width="210" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="140.0" y="138" font-size="14.5" font-weight="700" fill="#2563eb" text-anchor="middle">1  Input</text>
<text x="140.0" y="160" font-size="10.5" font-weight="400" fill="#111827" text-anchor="middle">script or reference video in</text>
<text x="140.0" y="174" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">art style and genre locked</text>
<line x1="248" y1="145.0" x2="271" y2="145.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="35" y="234" width="210" height="92" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="47" y="254" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="start">writes</text>
<text x="47" y="274" font-size="11" font-weight="400" fill="#111827" text-anchor="start">projects.novelText</text>
<text x="47" y="291" font-size="11" font-weight="400" fill="#111827" text-anchor="start">projects.artStyle</text>
<line x1="140.0" y1="186" x2="140.0" y2="230" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="275" y="108" width="210" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="380.0" y="138" font-size="14.5" font-weight="700" fill="#2563eb" text-anchor="middle">2  Analysis</text>
<text x="380.0" y="160" font-size="10.5" font-weight="400" fill="#111827" text-anchor="middle">split scenes, extract cast</text>
<text x="380.0" y="174" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">episode structure out</text>
<line x1="488" y1="145.0" x2="511" y2="145.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="275" y="234" width="210" height="92" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="287" y="254" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="start">writes</text>
<text x="287" y="274" font-size="11" font-weight="400" fill="#111827" text-anchor="start">episodes.scenes[]</text>
<text x="287" y="291" font-size="11" font-weight="400" fill="#111827" text-anchor="start">emotionArc · visualStyle</text>
<line x1="380.0" y1="186" x2="380.0" y2="230" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="515" y="108" width="210" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="620.0" y="138" font-size="14.5" font-weight="700" fill="#2563eb" text-anchor="middle">3  Casting</text>
<text x="620.0" y="160" font-size="10.5" font-weight="400" fill="#111827" text-anchor="middle">character / scene / prop design</text>
<text x="620.0" y="174" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">one ref image pins one face</text>
<line x1="728" y1="145.0" x2="751" y2="145.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="515" y="234" width="210" height="92" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="527" y="254" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="start">writes</text>
<text x="527" y="274" font-size="11" font-weight="400" fill="#111827" text-anchor="start">assets(kind=CHARACTER</text>
<text x="527" y="291" font-size="11" font-weight="400" fill="#111827" text-anchor="start">PROP / LOCATION)</text>
<line x1="620.0" y1="186" x2="620.0" y2="230" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="755" y="108" width="210" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="860.0" y="138" font-size="14.5" font-weight="700" fill="#2563eb" text-anchor="middle">4  Storyboard</text>
<text x="860.0" y="160" font-size="10.5" font-weight="400" fill="#111827" text-anchor="middle">shot length, prompt, references</text>
<text x="860.0" y="174" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">shots and shot groups</text>
<line x1="968" y1="145.0" x2="991" y2="145.0" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="755" y="234" width="210" height="92" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="767" y="254" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="start">writes</text>
<text x="767" y="274" font-size="11" font-weight="400" fill="#111827" text-anchor="start">shots(referencedAssets[]</text>
<text x="767" y="291" font-size="11" font-weight="400" fill="#111827" text-anchor="start">purposeTag · aspectRatio)</text>
<line x1="860.0" y1="186" x2="860.0" y2="230" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="995" y="108" width="210" height="74" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
<text x="1100.0" y="138" font-size="14.5" font-weight="700" fill="#2563eb" text-anchor="middle">5  Production</text>
<text x="1100.0" y="160" font-size="10.5" font-weight="400" fill="#111827" text-anchor="middle">generate, pick, compose, export</text>
<text x="1100.0" y="174" font-size="10" font-weight="400" fill="#6b7280" text-anchor="middle">rendered on the client</text>
<rect x="995" y="234" width="210" height="92" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="1007" y="254" font-size="10.5" font-weight="700" fill="#6b7280" text-anchor="start">writes</text>
<text x="1007" y="274" font-size="11" font-weight="400" fill="#111827" text-anchor="start">tasks → materials</text>
<text x="1007" y="291" font-size="11" font-weight="400" fill="#111827" text-anchor="start">render_jobs → final cut</text>
<line x1="1100.0" y1="186" x2="1100.0" y2="230" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#ar)"/>
<text x="40" y="396" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Data objects (PostgreSQL metadata; not a single media byte on the server)</text>
<rect x="40" y="408" width="168" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="124.0" y="436" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">projects</text>
<line x1="211" y1="430" x2="230" y2="430" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="234" y="408" width="168" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="318.0" y="436" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">episodes</text>
<line x1="405" y1="430" x2="424" y2="430" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="428" y="408" width="168" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="512.0" y="436" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">assets</text>
<line x1="599" y1="430" x2="618" y2="430" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="622" y="408" width="168" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="706.0" y="436" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">shots</text>
<line x1="793" y1="430" x2="812" y2="430" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="816" y="408" width="168" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="900.0" y="436" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">materials</text>
<line x1="987" y1="430" x2="1006" y2="430" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="1010" y="408" width="168" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="1094.0" y="436" font-size="12.5" font-weight="700" fill="#111827" text-anchor="middle">render_jobs</text>
<rect x="40" y="474" width="372" height="62" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="54" y="496" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">tasks + task_events</text>
<text x="54" y="518" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">async tasks and progress events (4 queues)</text>
<rect x="440" y="474" width="372" height="62" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="454" y="496" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">billing_ledger</text>
<text x="454" y="518" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">CNY → credits, +20%, rounded up, min 1</text>
<rect x="840" y="474" width="372" height="62" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
<text x="854" y="496" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">api_configs</text>
<text x="854" y="518" font-size="11" font-weight="400" fill="#6b7280" text-anchor="start">platform key pool, rotated per model group</text>
<text x="40" y="596" font-size="12.5" font-weight="700" fill="#111827" text-anchor="start">Four rules that hold across the whole pipeline</text>
<rect x="40" y="610" width="568" height="96" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
<text x="56" y="636" font-size="12" font-weight="700" fill="#92400e" text-anchor="start">A shot group references at most 4 characters</text>
<text x="56" y="658" font-size="10.5" font-weight="400" fill="#78350f" text-anchor="start">Seedance loses face stability past 4 referenced characters and starts producing</text>
<text x="56" y="676" font-size="10.5" font-weight="400" fill="#78350f" text-anchor="start">twins — so we reject with 400 up front instead of picking a clean frame afterwards.</text>
<rect x="636" y="610" width="568" height="96" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
<text x="652" y="636" font-size="12" font-weight="700" fill="#92400e" text-anchor="start">Sensitive terms map in one place, live on all three paths</text>
<text x="652" y="658" font-size="10.5" font-weight="400" fill="#78350f" text-anchor="start">Asset images, staging shots and video share one sanitize function; the video path</text>
<text x="652" y="676" font-size="10.5" font-weight="400" fill="#78350f" text-anchor="start">re-checks after the LLM rewrite so a banned term cannot creep back in.</text>
<rect x="40" y="722" width="568" height="96" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
<text x="56" y="748" font-size="12" font-weight="700" fill="#92400e" text-anchor="start">Key pool + concurrency gate, per-user ceiling adjustable</text>
<text x="56" y="770" font-size="10.5" font-weight="400" fill="#78350f" text-anchor="start">Beyond the global limit each user gets their own ceiling; a failing key cools down</text>
<text x="56" y="788" font-size="10.5" font-weight="400" fill="#78350f" text-anchor="start">and the request rotates to the next one rather than hammering the upstream.</text>
<rect x="636" y="722" width="568" height="96" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
<text x="652" y="748" font-size="12" font-weight="700" fill="#92400e" text-anchor="start">Lease + heartbeat, but heartbeat is not proof of life</text>
<text x="652" y="770" font-size="10.5" font-weight="400" fill="#78350f" text-anchor="start">Heartbeat renews every 30 s, yet a wedged job still looks fresh — so there is a</text>
<text x="652" y="788" font-size="10.5" font-weight="400" fill="#78350f" text-anchor="start">second claim ceiling that ignores heartbeat (4 h default, 12 h for long video).</text>
<text x="40" y="866" font-size="10.5" font-weight="400" fill="#9ca3af" text-anchor="start">Derived from the code and migrations in this repository — not a UI screenshot.</text>
</svg>

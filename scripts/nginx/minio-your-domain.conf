# ============================================================
# MinIO 公网入口 — presigned URL 用。保 Host = 保 SigV4 签名。
# ============================================================
# 部署位置：服务器 /etc/nginx/conf.d/minio-your-domain.conf
# 部署方式：bash scripts/provision-nginx-minio.sh
#
# 为什么必须 `proxy_set_header Host $host`：
#   MinIO presigned URL 用 AWS SigV4 签名，签名串里包含客户端请求时的
#   `Host` 头。若 nginx 默认改写成 `proxy_pass` 目标（127.0.0.1:9000），
#   MinIO 收到的 Host 与签名时不同 → 验签失败 → 每个 presigned URL 403。
#   因此这里强制把客户端原始 Host 原样透传给上游 MinIO。
#
# 路径前缀（/minio/）行不通：
#   presigned URL 把签名绑在 URL path 上，无法在 path 前面再插一层前缀；
#   所以必须用独立子域 minio.your-domain.example.com，server_name 单独匹配。
#
# HTTPS：本文件只配 :80。certbot --nginx 后会自动追加 listen 443 ssl、
#   证书路径、以及 :80→:443 redirect，无需手改。
# ============================================================

server {
    listen 80;
    server_name minio.your-domain.example.com;
    # certbot --nginx 会自动加 listen 443 ssl + 证书路径 + redirect

    client_max_body_size 0;  # 大视频上传不限制

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;          # 关键：保客户端原始 Host，SigV4 签名验签依赖它
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;                  # MinIO 流式
        proxy_read_timeout 300s;
    }
}
